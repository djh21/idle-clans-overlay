<title>Idle Clans Profit</title>

<meta name="theme-color" content="#f3f5f9">
<style>
:root{--bg:#f3f5f9;--panel:#fff;--line:#d9dfe9;--fg:#1b2433;--muted:#5f6b7d;--accent:#b8860b;--loss:#c23b3b;color-scheme:light}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Rubik,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 24px;width:min(360px,100%);box-shadow:0 2px 8px rgba(27,36,51,.06)}
h1{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1::before{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,#d4a017 60%,#9a6f0a)}
p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
input{width:100%;box-sizing:border-box;font:16px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);text-transform:uppercase}
button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--fg);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--loss);font-size:13px;margin-top:10px;min-height:1.2em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--panel:#181c25;--line:#2a303c;--fg:#e7eaf0;--muted:#98a1b3;--loss:#f07070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--panel:#181c25;--line:#2a303c;--fg:#e7eaf0;--muted:#98a1b3;--loss:#f07070;color-scheme:dark}
button{background:var(--fg);color:var(--bg)}
.lbl{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
label.small{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>

  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="IC-XXXX-XXXX-XXXX" aria-label="Invite code">

  <div class="err" id="err"></div>
</form>

<script>
(async () => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const norm = c => c.trim().toUpperCase().replace(/\s+/g, "");
  async function unwrap(code){
    const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
    for (const w of P.keys){
      const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(w.s), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      try { const K = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(w.i)}, k, u8(w.w)); return K; } catch(e) {}
    }
    return null;
  }
  async function open(K){
    const key = await crypto.subtle.importKey("raw", K, {name:"AES-GCM"}, false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(P.iv)}, key, u8(P.ct)));
    document.open(); document.write(html); document.close();
  }
  const f = document.getElementById("f"), inp = document.getElementById("code"), uinp = document.getElementById("user"), err = document.getElementById("err"), btn = document.getElementById("go");
  async function verifyPlayer(name){
    const r = await fetch("https://query.idleclans.com/api/Player/profile/" + encodeURIComponent(name), {cache:"no-store"});
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("player lookup failed (" + r.status + ")");
    const j = await r.json();
    return j && j.username ? j.username : name;
  }
  function rememberPlayer(name){
    try { const s = JSON.parse(localStorage.getItem("icp-settings") || "{}"); s.player = name; localStorage.setItem("icp-settings", JSON.stringify(s)); } catch(e) {}
  }
  let saved = null; try { saved = localStorage.getItem("icp-code"); } catch(e) {}
  if (saved){ const K = await unwrap(saved); if (K) return open(K); try { localStorage.removeItem("icp-code"); } catch(e) {} }
  f.addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = ""; btn.disabled = true; btn.textContent = "Checking…";
    const fail = (msg, el) => { err.textContent = msg; btn.disabled = false; btn.textContent = "Unlock"; if (el) el.focus(); };
    const name = uinp.value.trim();
    if (!name) return fail("Enter your Idle Clans username.", uinp);
    const code = norm(inp.value);
    const K = code ? await unwrap(code) : null;
    if (!K) return fail("That invite code isn't valid.", inp);
    let real;
    try { real = await verifyPlayer(name); } catch(ex) { return fail("Couldn't reach the Idle Clans player database. Check your connection and try again."); }
    if (!real) return fail("No Idle Clans player called \"" + name + "\". Use your main account's exact username.", uinp);
    rememberPlayer(real);
    if (document.getElementById("remember").checked){ try { localStorage.setItem("icp-code", code); } catch(e) {} }
    open(K);
  });
  uinp.focus();
})();
</script>
